name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-apk.yml"]

permissions:
  contents: write

env:
  SING_BOX_VERSION: "v1.13.21"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Restore sing-box core
        id: libbox
        uses: actions/cache@v4
        with:
          path: android/app/libs/libbox.aar
          key: libbox-${{ env.SING_BOX_VERSION }}-android-arm64-v1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        if: steps.libbox.outputs.cache-hit != 'true'
        with:
          go-version: "1.25.12"
          cache: false

      - uses: nttld/setup-ndk@v1
        id: ndk
        if: steps.libbox.outputs.cache-hit != 'true'
        with:
          ndk-version: r28

      - name: Build sing-box core (libbox.aar)
        if: steps.libbox.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          git clone -q --depth 1 --branch "$SING_BOX_VERSION" https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android -platform android/arm64
          mkdir -p "$GITHUB_WORKSPACE/android/app/libs"
          cp libbox.aar "$GITHUB_WORKSPACE/android/app/libs/libbox.aar"

      - name: Install Android SDK 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PnodesUrl="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/nodes/nodes.json" \
            -PbuildNumber="${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/VPNHub.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: VPNHub-apk
          path: VPNHub.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: VPN Hub ${{ github.run_number }}
          files: VPNHub.apk
          make_latest: true
          body: 下載 VPNHub.apk 安裝（Android 16 或以上）。
