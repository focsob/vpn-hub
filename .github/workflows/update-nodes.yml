name: Update nodes

# Every hour: fetch public node lists, test every node with real cores,
# group the working ones by exit country and publish them to the "nodes" branch.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["collector/**", ".github/workflows/update-nodes.yml"]

permissions:
  contents: write

concurrency:
  group: update-nodes
  cancel-in-progress: false

env:
  SING_BOX_VERSION: "1.14.3"
  # 盡量多搵呢幾個國家嘅節點（ISO 國家代碼，逗號分隔）
  PRIORITY_COUNTRIES: "PH,IN,TR,AR,KZ"
  DEBUG_OPENVPN: "1"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sing-box and Python packages
        run: |
          curl -fsSL -o /tmp/sb.tgz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          tar xzf /tmp/sb.tgz -C /tmp
          sudo install "/tmp/sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
          python -m pip install -q -r collector/requirements.txt
          curl -fsSL -o collector/Country.mmdb \
            https://github.com/Loyalsoldier/geoip/releases/latest/download/Country.mmdb

      - name: Collect and test nodes
        run: |
          set -o pipefail
          mkdir -p logs
          python -u collector/collect.py --out out 2>&1 | tee logs/update-nodes.log

      - name: Publish to the nodes branch
        run: |
          cd out
          git init -q -b nodes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "nodes $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" nodes

      - name: Upload run log to the logs branch
        if: always()
        run: |
          mkdir -p logs && cd logs
          git init -q -b logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "update-nodes log $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" logs:logs-update
